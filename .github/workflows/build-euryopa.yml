name: Build Euryopa

on:
  push:
    branches: [master, PE]
  pull_request:
    branches: [master, PE]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBRW: ${{ github.workspace }}/librw
  LIBRW_REF: 15ffa585216a9a7573ecc597b19ce2fde9b935f2

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout ariane
        uses: actions/checkout@v4
        with:
          path: ariane

      - name: Checkout librw
        uses: actions/checkout@v4
        with:
          repository: Southland-FR/librw
          ref: ${{ env.LIBRW_REF }}
          path: librw
          # If this repo is private, add a PAT secret:
          # token: ${{ secrets.LIBRW_TOKEN }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Premake5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip" -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath premake5
          echo "${{ github.workspace }}\premake5" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Read version from header
        id: version
        shell: pwsh
        working-directory: ariane
        run: |
          $content = Get-Content "tools/euryopa/version.h" -Raw
          if ($content -match '#define\s+ARIANE_VERSION\s+"([^"]+)"') {
            $ver = $Matches[1]
          } else {
            $ver = "0.0.0"
          }
          $ref = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.base_ref }}" } else { "${{ github.ref_name }}" }
          $branch = if ($ref -eq "PE") { "PE" } else { "master" }
          $shortsha = "${{ github.sha }}".Substring(0, 7)
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v${ver}-${branch}-${shortsha}" >> $env:GITHUB_OUTPUT
          echo "channel=$branch" >> $env:GITHUB_OUTPUT

      - name: Generate librw project files
        shell: cmd
        working-directory: librw
        run: premake5 vs2019

      - name: Build librw
        shell: cmd
        working-directory: librw/build
        run: msbuild librw.sln /p:Configuration=Release /p:Platform=win-amd64-d3d9 /t:librw /m

      - name: Generate ariane project files
        shell: cmd
        working-directory: ariane
        run: premake5 vs2019 --channel=${{ steps.version.outputs.channel }}

      - name: Build euryopa
        shell: cmd
        working-directory: ariane/build
        run: msbuild librwgta.sln /p:Configuration=Release /p:Platform=win-amd64-d3d9 /t:librwgta;euryopa /m

      - name: Upload euryopa.exe
        uses: actions/upload-artifact@v4
        with:
          name: ariane-windows-d3d9
          path: ariane/bin/win-amd64-d3d9/Release/ariane.exe

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ariane ${{ steps.version.outputs.version }} (${{ steps.version.outputs.channel }})
          body: |
            Ariane ${{ steps.version.outputs.version }} — channel: **${{ steps.version.outputs.channel }}**
          files: ariane/bin/win-amd64-d3d9/Release/ariane.exe
          draft: false
          prerelease: ${{ steps.version.outputs.channel == 'PE' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux x64 (OpenGL)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout ariane
        uses: actions/checkout@v4
        with:
          path: ariane

      - name: Checkout librw
        uses: actions/checkout@v4
        with:
          repository: Southland-FR/librw
          ref: ${{ env.LIBRW_REF }}
          path: librw

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libglfw3-dev xauth xvfb

      - name: Install Premake5
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-linux.tar.gz \
            --output premake5.tar.gz
          echo "98c0dbf55f20d28ecc2b5fdd4a5c9bfe5ef461d26d3b023b4dfd7d75f4df3a3f  premake5.tar.gz" | sha256sum --check
          mkdir premake5
          tar --extract --gzip --file premake5.tar.gz --directory premake5
          chmod +x premake5/premake5
          premake5/premake5 --version
          echo "${{ github.workspace }}/premake5" >> "$GITHUB_PATH"

      - name: Generate librw project files
        working-directory: librw
        run: premake5 gmake2

      - name: Build librw
        working-directory: librw
        env:
          CXXFLAGS: -std=c++14
        run: make --directory build --jobs 2 config=release_linux-amd64-gl3 librw

      - name: Generate ariane project files
        working-directory: ariane
        env:
          ARIANE_CHANNEL: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          if [ "$ARIANE_CHANNEL" != PE ]; then ARIANE_CHANNEL=master; fi
          premake5 gmake2 --channel="$ARIANE_CHANNEL"

      - name: Build Ariane
        working-directory: ariane
        run: make --directory build --jobs 2 config=release_linux-amd64-gl3 euryopa

      - name: Smoke test OpenGL startup
        working-directory: ariane/bin/linux-amd64-gl3/Release
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            ./ariane > smoke-test.log 2>&1
          status=$?
          set -e
          cat smoke-test.log
          test "$status" -eq 1
          grep --quiet "error: unknown game" smoke-test.log

      - name: Package Linux artifact
        working-directory: ariane
        run: |
          tar --create --gzip --file ariane-linux-x64.tar.gz \
            --directory bin/linux-amd64-gl3/Release ariane
          sha256sum ariane-linux-x64.tar.gz > ariane-linux-x64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ariane-linux-x64
          path: |
            ariane/ariane-linux-x64.tar.gz
            ariane/ariane-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
